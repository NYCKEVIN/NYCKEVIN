<svg xmlns="http://www.w3.org/2000/svg" width="960" height="70" viewBox="0 0 960 70" role="img" aria-label="Flutter / Dart / Mobile Apps Architecture">
<style>
text{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:26px;font-weight:800;fill:#f1f3f8;}
.cov{animation:type 3.2s steps(41,end) .4s both;transform-box:fill-box;transform-origin:right center}
@keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cur{animation:mv 3.2s steps(41,end) .4s both, blink 1s steps(2,start) infinite}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(639.6px)}}
@keyframes blink{to{visibility:hidden}}
</style>
<rect width="960" height="70" rx="12" fill="#0b0d12"/>
<text x="160.2" y="45" textLength="639.6" lengthAdjust="spacingAndGlyphs">Flutter / Dart / Mobile Apps Architecture</text>
<rect class="cov" x="158.2" y="10" width="645.6" height="48" fill="#0b0d12"/>
<rect class="cur" x="160.2" y="20" width="12" height="30" fill="#5eead4"/>
</svg>